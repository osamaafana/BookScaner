# BookScanner: same pattern as the other projects on the server.
# Containers only join the shared proxy_network; Nginx Proxy Manager routes
#   book-scanner.net / www  -> bookscaner-web-ui:80
#   api.book-scanner.net    -> bookscaner-web-gateway:3001
# Run from the repo root: docker compose up -d --build
services:
  backend:
    build:
      context: ./backend
    container_name: bookscaner-backend
    env_file:
      - .env
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - proxy_network

  web-ui:
    build:
      context: ./frontend/web-ui
      dockerfile: Dockerfile
      args:
        VITE_GATEWAY_URL: ""
    container_name: bookscaner-web-ui
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - proxy_network

  web-gateway:
    build:
      context: ./frontend/web-gateway
      dockerfile: Dockerfile
    container_name: bookscaner-web-gateway
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://bookscaner-backend:8000
      - PORT=3001
    restart: unless-stopped
    expose:
      - "3001"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - backend
    networks:
      - proxy_network

networks:
  proxy_network:
    external: true
    name: proxy_network
