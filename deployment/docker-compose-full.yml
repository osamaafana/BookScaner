services:
  backend:
    build:
      context: ../backend
    container_name: bookscaner-backend
    env_file:
      - ../.env
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    restart: unless-stopped
    network_mode: host

  web-ui:
    build:
      context: ../frontend/web-ui
      dockerfile: Dockerfile
      args:
        VITE_GATEWAY_URL: ""
    container_name: bookscaner-web-ui
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - app-network
      - proxy_network

  web-gateway:
    build:
      context: ../frontend/web-gateway
      dockerfile: Dockerfile
    container_name: bookscaner-web-gateway
    env_file:
      - ../.env
    environment:
      - BACKEND_URL=http://172.17.0.1:8000
      - PORT=3001
    restart: unless-stopped
    expose:
      - "3001"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - backend
    networks:
      - app-network
      - proxy_network

networks:
  app-network:
    driver: bridge
  proxy_network:
    external: true
    name: proxy_network
